[package]
name = "cryptolite"
version = "0.7.11"
description = "КриптоЛайт — приложение для подписания и шифрования файлов"
authors = ["Илья Д. (rad.io) <ilyadud@mail.ru>"]
edition = "2021"

[lib]
name = "cryptolite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libloading = "0.8"
lopdf = { version = "0.46", default-features = false }
base64 = "0.23"

[target.'cfg(target_os = "linux")'.dependencies]
# SHA-1 отпечаток сертификата для `cryptcp -thumbprint` (CAdES-BES/T).
sha1 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_Globalization"] }
winreg = "0.56"

