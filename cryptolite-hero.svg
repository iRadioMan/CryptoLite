<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-labelledby="cryptolite-hero-title cryptolite-hero-desc">
  <title id="cryptolite-hero-title">КриптоЛайт: скачал — запустил — подписал</title>
  <desc id="cryptolite-hero-desc">Мультяшный офисный работник сидит за компьютером. Над ним облако с текстом: «Зачем платить за сложные программы, если есть КриптоЛайт? Скачал — запустил — подписал — и в ус не дуешь! Даже устанавливать не нужно»</desc>
  <defs>
    <linearGradient id="cryptolite-brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B7BD6"/>
      <stop offset="1" stop-color="#2F6DF1"/>
    </linearGradient>
  </defs>

  <path d="M 90 20 H 1110 A 40 40 0 0 1 1150 60 V 264 A 40 40 0 0 1 1110 304 H 90 A 40 40 0 0 1 50 264 V 60 A 40 40 0 0 1 90 20 Z" transform="translate(10 -2)" fill="#DCE9FF"/>
