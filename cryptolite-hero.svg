  <g transform="translate(0 -12)" font-family="Segoe UI, Helvetica Neue, Arial, Liberation Sans, sans-serif" fill="#1F2733">
    <text x="100" y="88" font-size="42" font-weight="700" letter-spacing="-0.6">Зачем платить за сложные программы,</text>
    <text x="100" y="140" font-size="42" font-weight="700" letter-spacing="-0.6">если есть <tspan fill="url(#cryptolite-brand)">КриптоЛайт</tspan>?</text>
    <text x="100" y="200" font-size="28" fill="#4B5563"><tspan fill="#2F6DF1" font-weight="600">Скачал</tspan><tspan fill="#7A8496"> — </tspan><tspan fill="#2F6DF1" font-weight="600">запустил</tspan><tspan fill="#7A8496"> — </tspan><tspan fill="#2F6DF1" font-weight="600">подписал</tspan><tspan fill="#4B5563"> — и в ус не дуешь!</tspan></text>
    <text x="100" y="256" font-size="28" fill="#4B5563">Даже устанавливать <tspan font-weight="700" fill="#1F7A4D">не нужно</tspan></text>
  </g>

